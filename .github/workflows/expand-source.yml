name: Expand Grand Cafe source bundle

on:
  push:
    paths:
      - 'source-bundle/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source bundle
        shell: bash
        run: |
          if [ ! -f source-bundle/READY ]; then
            echo "Bundle already expanded."
            exit 0
          fi
          cat source-bundle/source.zip.b64.part* > /tmp/grand-cafe-source.b64
          base64 --decode /tmp/grand-cafe-source.b64 > /tmp/grand-cafe-source.zip
          unzip -o /tmp/grand-cafe-source.zip -d .

          if [ -f source-bundle/v686-customizer.css ]; then
            cat source-bundle/v686-customizer.css >> client/src/styles.css
          fi
          if [ -f source-bundle/v686-notes.md ]; then
            cat source-bundle/v686-notes.md >> UPDATE_NOTES.md
          fi

          rm -rf source-bundle

      - name: Commit expanded project source
        shell: bash
        run: |
          if [ ! -d source-bundle ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No source changes to commit."
            else
              git commit -m "Deploy Grand Cafe v6.8.6"
              git push
            fi
          fi
